name: Release

# Pushing a tag vX.Y.Z builds a signed APK and publishes it as a GitHub Release.
# Signing comes from repository secrets; the keystore never enters the repo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KAUTH_KEYSTORE_BASE64 }}
          KAUTH_KEYSTORE_PASSWORD: ${{ secrets.KAUTH_KEYSTORE_PASSWORD }}
          KAUTH_KEY_ALIAS: ${{ secrets.KAUTH_KEY_ALIAS }}
          KAUTH_KEY_PASSWORD: ${{ secrets.KAUTH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "tag $TAG is not vX.Y.Z" >&2; exit 1
          fi
          # 1.2.3 -> 10203, so every release installs over the one before.
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          export KAUTH_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KAUTH_KEYSTORE"
          ./gradlew test :app:assembleRelease -Pkauth.versionName="${TAG#v}" -Pkauth.versionCode="$code"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/KAuth-$TAG.apk"
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
